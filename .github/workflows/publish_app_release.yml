name: app-build-action

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: '版本号 (例如 v1.1.0)'
        required: false
        default: 'v1.1.0-fix'

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: 签出代码
        uses: actions/checkout@v4
        with:
          ref: master

      - name: 设置JAVA环境
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "17"
          cache: "gradle"

      - name: 设置Flutter环境
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.38.x"
          cache: true

      - name: 安装依赖
        run: |
          cd simple_live_app
          flutter pub get

      - name: 打包 APK（release模式，无debug标）
        run: |
          cd simple_live_app
          flutter build apk --release --split-per-abi

      - name: 重命名并收集 APK
        run: |
          mkdir -p apk_output
          cp simple_live_app/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk apk_output/simple_live_arm64-v8a.apk || true
          cp simple_live_app/build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk apk_output/simple_live_armeabi-v7a.apk || true
          ls -lh apk_output/

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: simple_live_apks
          path: apk_output/*.apk
          retention-days: 3

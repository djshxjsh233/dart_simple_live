name: app-build-action

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: '版本号 (例如 v1.1.0)'
        required: false
        default: 'v1.1.0-fix'

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: 签出代码
        uses: actions/checkout@v4
        with:
          ref: master

      - name: 设置JAVA环境
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "17"
          cache: "gradle"

      - name: 设置Flutter环境
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.38.x"
          cache: true

      - name: 安装依赖
        run: |
          cd simple_live_app
          flutter pub get

      - name: 打包 APK（arm64-v8a）
        run: |
          cd simple_live_app
          flutter build apk --debug --target-platform android-arm64

      - name: 重命名 arm64-v8a APK
        run: |
          cp simple_live_app/build/app/outputs/flutter-apk/app-arm64-v8a-debug.apk \
             simple_live_app/build/app/outputs/flutter-apk/simple_live_arm64-v8a.apk

      - name: 打包 APK（armeabi-v7a）
        run: |
          cd simple_live_app
          flutter build apk --debug --target-platform android-arm

      - name: 重命名 armeabi-v7a APK
        run: |
          cp simple_live_app/build/app/outputs/flutter-apk/app-armeabi-v7a-debug.apk \
             simple_live_app/build/app/outputs/flutter-apk/simple_live_armeabi-v7a.apk

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: simple_live_apks
          path: |
            simple_live_app/build/app/outputs/flutter-apk/simple_live_*.apk
          retention-days: 3
